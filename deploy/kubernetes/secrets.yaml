apiVersion: v1
kind: Secret
metadata:
  name: transcription-secrets
  namespace: transcription-app
type: Opaque
stringData:
  # データベース認証情報（実際の値はCI/CDで設定）
  DATABASE_URL: "postgresql+asyncpg://user:password@postgres-service:5432/transcription"

  # Redis認証
  REDIS_PASSWORD: ""

  # JWT設定
  JWT_SECRET_KEY: "your-super-secret-jwt-key-change-in-production"
  JWT_ALGORITHM: "HS256"

  # OpenAI API
  OPENAI_API_KEY: ""

  # AWS認証情報
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""

  # Slack連携
  SLACK_CLIENT_ID: ""
  SLACK_CLIENT_SECRET: ""

  # Google連携
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
  namespace: transcription-app
type: Opaque
stringData:
  POSTGRES_USER: "transcription"
  POSTGRES_PASSWORD: "secure-postgres-password"
  POSTGRES_DB: "transcription"
