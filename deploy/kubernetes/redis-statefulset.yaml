apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: transcription-app
spec:
  serviceName: redis-service
  replicas: 1
  selector:
    matchLabels:
      app: transcription
      component: redis
  template:
    metadata:
      labels:
        app: transcription
        component: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          command:
            - redis-server
            - --appendonly
            - "yes"
            - --maxmemory
            - 512mb
            - --maxmemory-policy
            - allkeys-lru
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          volumeMounts:
            - name: redis-data
              mountPath: /data
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 30
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
        storageClassName: ssd
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: transcription-app
spec:
  type: ClusterIP
  selector:
    app: transcription
    component: redis
  ports:
    - port: 6379
      targetPort: 6379
