apiVersion: v1
kind: ServiceAccount
metadata:
  name: transcription-app
  namespace: transcription-app
  annotations:
    # AWS IAM Role (IRSA)
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/transcription-app-role
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: transcription-app-role
  namespace: transcription-app
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: transcription-app-rolebinding
  namespace: transcription-app
subjects:
  - kind: ServiceAccount
    name: transcription-app
    namespace: transcription-app
roleRef:
  kind: Role
  name: transcription-app-role
  apiGroup: rbac.authorization.k8s.io
