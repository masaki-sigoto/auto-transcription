apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: transcription-app
spec:
  serviceName: postgres-service
  replicas: 1
  selector:
    matchLabels:
      app: transcription
      component: postgres
  template:
    metadata:
      labels:
        app: transcription
        component: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - transcription
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - transcription
            initialDelaySeconds: 30
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 100Gi
        storageClassName: ssd
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: transcription-app
spec:
  type: ClusterIP
  selector:
    app: transcription
    component: postgres
  ports:
    - port: 5432
      targetPort: 5432
