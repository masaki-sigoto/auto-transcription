apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: transcription-app
  labels:
    app: transcription
    component: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: transcription
      component: worker
  template:
    metadata:
      labels:
        app: transcription
        component: worker
    spec:
      serviceAccountName: transcription-app
      containers:
        - name: worker
          image: transcription-app/worker:latest
          imagePullPolicy: Always
          command: ["celery", "-A", "app.worker", "worker", "--loglevel=info"]
          envFrom:
            - configMapRef:
                name: transcription-config
            - secretRef:
                name: transcription-secrets
          resources:
            requests:
              cpu: "1000m"
              memory: "2Gi"
            limits:
              cpu: "4000m"
              memory: "8Gi"
              nvidia.com/gpu: "1"  # GPU使用時
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
            - name: whisper-models
              mountPath: /root/.cache/whisper
      volumes:
        - name: tmp-volume
          emptyDir:
            sizeLimit: 10Gi
        - name: whisper-models
          persistentVolumeClaim:
            claimName: whisper-models-pvc
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
      nodeSelector:
        accelerator: nvidia-tesla-t4
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: worker-hpa
  namespace: transcription-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: worker
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: External
      external:
        metric:
          name: celery_queue_length
        target:
          type: Value
          value: "10"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: whisper-models-pvc
  namespace: transcription-app
spec:
  accessModes:
    - ReadOnlyMany
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard
